---
name: "HAOS Wayland Kiosk"
description: "A Wayland-native kiosk dashboard using Cage and Chromium (TrooperThorn)"
version: "2.0"
slug: "haos_wayland_kiosk"
url: https://github.com/trooperthorn/HAOS-kiosk/tree/Wayland
init: false
arch:
  - aarch64
  - amd64
  - armv7
# Required for hardware acceleration and Wayland direct rendering
video: true
udev: true
# Required to map touchscreens, mice, and keyboards
devices:
  - /dev/input:/dev/input
# Host network allows Chromium to resolve internal mDNS if needed
network_description: "host"
host_network: true

#UNMODIFIED ORIGINAL
startup: application
ingress: true
homeassistant_api: true
auth_api: true
audio: true
usb: true

ulimits:
  nofile:
    soft: 65536
    hard: 65536

map:
  - addon_config:rw
  - media:rw

privileged:
  - SYS_ADMIN

options:
  browser: "chromium"
  # Screen Hygene
  rotate_display: "right"
  output_number: 1
  screen_timeout: 0
  login_delay: 1.0
  browser_refresh: 43200
  # Configure Home Assistant
  ha_url: "http://supervisor/core"
  ha_dashboard: ""
  dark_mode: true
  ha_theme: ""
  ha_sidebar: "none"
  # COMMS with HA
  rest_ip: "127.0.0.1"
  rest_port: 8073
  rest_bearer_token: ""
  #Should not usually be modified.
  zoom_level: 100
  map_touch_inputs: true
  onscreen_keyboard: true
  keyboard_layout: us
  cursor_timeout: 5
  save_onscreen_config: true
  audio_sink: "auto"
  xorg_conf: ""
  xorg_append_replace: "append"
  gestures:
    - '"1_ANY_1_CORNER_TOPRIGHT": {"cmds": "kiosk.toggle_keyboard", "msg": "Toggling Onboard keyboard..."}'
    - '"[Left]_MOUSE_3_CLICK": {"cmds": "kiosk.toggle_keyboard", "msg": "Toggling Onboard keyboard..."}'
    - '"3_TOUCH_1_TAP": {"cmds": "kiosk.toggle_keyboard", "msg": "Toggling Onboard keyboard..."}'
    - '"3_TOUCH_2_TAP": {"cmds": "kiosk.refresh_browser", "msg": "Refresh Browser"}'
    - '"3_TOUCH_3_TAP": {"cmds": "kiosk.toggle_audio", "msg": "Toggle audio mute"}'
    - '"3_TOUCH_4_TAP": {"cmds": "kiosk.screenshot", "msg": "Save screenshot"}'
    - '"3+_TOUCH_1_SWIPE_LEFT": {"cmds": "kiosk.forward", "msg": "Go forward in the history browser"}'
    - '"3+_TOUCH_1_SWIPE_RIGHT": {"cmds": "kiosk.back", "msg": "Go back in the history browser"}'
    - '"2_TOUCH_3_TAP": {"cmds": "kiosk.launch_url", "msg": "Restore default dashboard: HA_URL/HA_DASHBOARD"}'
    - '"2_TOUCH_4_TAP": {"cmds": [["kiosk.launch_url", "www.google.com"]], "msg": "Open Google search"}'
  command_whitelist: "xset|xdotool|luakit|chromium-browser"
  # IF Browser MOD is in use, only need xset|luakit or xset|chromium
  vnc_server: ""
  debug_mode: false
  ignore_certificate_errors: false

schema:
  browser: list(luakit|chromium)
  rotate_display: list(normal|left|right|inverted)
  ha_username: str
  ha_password: password
  ha_url: str
  ha_dashboard: str?
  browser_refresh: int(0,)
  ha_sidebar: list(full|narrow|none)
  ha_theme: str?
  dark_mode: bool
  login_delay: float(0,)
  zoom_level: int(10,1000)
  screen_timeout: int(0,)
  output_number: int(1,2)
  map_touch_inputs: bool
  cursor_timeout: int
  keyboard_layout: str
  onscreen_keyboard: bool
  save_onscreen_config: bool
  audio_sink: list(auto|hdmi|usb|none)
  rest_ip: str
  rest_port: int(1024,49151)
  rest_bearer_token: password
  gestures:
    - str
  xorg_conf: str?
  xorg_append_replace: list(append|replace)
  command_whitelist: str
  vnc_server: password
  debug_mode: bool
  ignore_certificate_errors: bool

translations:
  - en

environment:
  DISPLAY: ":0"
